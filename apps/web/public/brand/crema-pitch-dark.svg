<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice" width="100%" height="100%" role="img" aria-label="A football pitch traced in crema on espresso">
<defs>
  <radialGradient id="base" cx="50%" cy="46%" r="75%"><stop offset="0" stop-color="#1f1712"/><stop offset="1" stop-color="#120d0a"/></radialGradient>
  <radialGradient id="crema" cx="50%" cy="50%" r="34%"><stop offset="0" stop-color="#e6b678" stop-opacity="0.22"/><stop offset=".45" stop-color="#e6b678" stop-opacity="0.077"/><stop offset="1" stop-color="#e6b678" stop-opacity="0"/></radialGradient>
