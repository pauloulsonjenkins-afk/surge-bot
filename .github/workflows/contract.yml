# Runs the contract test on every push and pull request.
#
# surge_live.py imports nine names from surge_alerts.py and reaches into their
# attributes. Three separate deploys died because that contract was broken by an
# edit that looked harmless in isolation. This catches it in about ten seconds,
# in the browser, before anything reaches DigitalOcean.
#
# A red cross on the commit means do not deploy.
 
name: Contract test
 
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:        # lets you run it by hand from the Actions tab
 
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Install dependencies
        run: pip install -r requirements.txt
 
      - name: Does surge_alerts still satisfy surge_live?
        run: python contract_test.py
 
      - name: Does surge_live.py actually import?
        run: python -c "import surge_live; print('surge_live imports cleanly')"
 
